<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>You're not connected💔 - My Thrift</title>
  <style>
    @font-face {
      font-family: "Satoshi";
      src: url("/Fonts/satoshi/Satoshi-Variable.woff2") format("woff2");
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Satoshi", sans-serif;
      font-synthesis: none;
      background-color: #f8f8f8;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #FF6600;
    }
    p {
      font-size: 1rem;
      margin-bottom: 20px;
      color: #555;
    }
    button {
      font-family: "Satoshi", sans-serif;
      background-color: #FF6600;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 75px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #e55a00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Uh Oh ...😢</h1>
    <p>There doesn't seem to be a connection right now 💔. Please check your internet and reload or try again later.</p>
    <button onclick="window.location.reload()">Reload Page</button>
  </div>
</body>
</html>
